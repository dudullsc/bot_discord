server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    trackStuckThresholdMs: 10000
    youtubePlaylistLoadLimit: 50
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # TV + OAuth is the most reliable on datacenter IPs.
    clients:
      - TV
      - WEBEMBEDDED
      - ANDROID_VR
      - MWEB
      - WEB
      - MUSIC
    clientOptions:
      TV:
        playlistLoading: false
        videoLoading: false
        searching: false
        playback: true
      WEBEMBEDDED:
        playlistLoading: false
        searching: false
        playback: true
      ANDROID_VR:
        playlistLoading: true
        videoLoading: true
        searching: false
        playback: true
      MWEB:
        playlistLoading: true
        videoLoading: true
        searching: true
        playback: true
      WEB:
        playlistLoading: true
        videoLoading: true
        searching: true
        playback: true
      MUSIC:
        playback: false
        playlistLoading: false
        videoLoading: false
    oauth:
      enabled: true
    # Do not hardcode expired poToken/visitorData — they break WEB/MWEB.
    # Generate fresh ones only if needed; TV+OAuth usually does not need pot.
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "bot-discord"
  lavasrc:
    sources:
      deezer: true
      spotify: false
      applemusic: false
      youtube: false
    deezer:
      # Chave pública exigida pelo plugin para descriptografar streams do Deezer.
      masterDecryptionKey: "e6ea6907039a8a0a2c5cae8e96fc6450"
      arl: "${DEEZER_ARL}"
      formats: ["MP3_128", "MP3_64"]

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
