apiVersion: v1
kind: ConfigMap
metadata:
  name: lavalink-config
  namespace: bot-discord
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  application.yml: |
    server:
      port: 2333
      address: 0.0.0.0

    lavalink:
      plugins:
        - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
          snapshot: false
        - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
          snapshot: false
      server:
        password: "unused-overridden-by-env"
        sources:
          youtube: false
          bandcamp: true
          soundcloud: true
          twitch: true
          vimeo: true
          http: true
          local: false
        bufferDurationMs: 400
        frameBufferDurationMs: 5000
        trackStuckThresholdMs: 10000
        youtubePlaylistLoadLimit: 6
        playerUpdateInterval: 5
        youtubeSearchEnabled: true
        soundcloudSearchEnabled: true
        gc-warnings: true

    plugins:
      lavasrc:
        providers:
          - "ytsearch:\"%ISRC%\""
          - "ytsearch:%QUERY%"
        sources:
          spotify: true
          applemusic: false
          deezer: false
          yandexmusic: false
          flowerytts: false
          youtube: false
          vkmusic: false
          tidal: false
          qobuz: false
          ytdlp: false
          jiosaavn: false
        spotify:
          clientId: "${SPOTIFY_CLIENT_ID:}"
          clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
          countryCode: "BR"
          playlistLoadLimit: 6
          albumLoadLimit: 6
      youtube:
        enabled: true
        allowSearch: true
        allowDirectVideoIds: true
        allowDirectPlaylistIds: true
        clients:
          - MUSIC
          - TV
          - TVHTML5_SIMPLY
          - MWEB
          - ANDROID_MUSIC
          - ANDROID_VR
          - WEB
        clientOptions:
          MUSIC:
            playback: false
        oauth:
          enabled: true

    logging:
      level:
        root: INFO
        lavalink: INFO
        dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
